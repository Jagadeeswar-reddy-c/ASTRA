global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/astra-alerts.yml

scrape_configs:
  - job_name: astra-node
    static_configs:
      - targets: ["exporter:9835"]
        labels: { site: "lab" }

  - job_name: llama-server
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-pooled:8080"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-pooled:8000"]
